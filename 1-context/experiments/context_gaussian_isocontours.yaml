name: context_gaussian_isocontours
description: Isodensity contours and samples of the bivariate Gaussian for three covariance regimes
path: 1-context/probability_densities
executable: 1-context/probability_densities/main.py
executable_command: uv run python
tags:
  - context
  - gaussian
  - distributions
  - illustration
params:
  n_samples: 300
  rho: 0.8
  condition: 50
actions:
  - register:
      name: register
      executable: register_latex.py
      executable_command: uv run python
      description: Stage a chosen figure (.tex) to hdr_exports/ for the LaTeX dissertation
  - add_to_docs:
      name: add_to_docs
      executable: 1-context/probability_densities/action_add_to_docs.py
      executable_command: uv run python
      description: Export Gaussian isodensity contours as Plotly JSON for the docs site
group: "Context · Illustrations"
