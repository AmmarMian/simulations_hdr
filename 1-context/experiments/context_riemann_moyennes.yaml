path: 1-context/riemann_moyennes
executable: 1-context/riemann_moyennes/main.py
executable_command: uv run python
tags:
  - context
  - riemann
  - geometry
  - illustration
params:
  n_matrices: 15
  dispersion: 0.9
  condition: 4.0
actions:
  - register:
      name: register
      executable: register_latex.py
      executable_command: uv run python
      description: Stage a chosen figure (.tex) to hdr_exports/ for the LaTeX dissertation
  - add_to_docs:
      name: add_to_docs
      executable: 1-context/riemann_moyennes/action_add_to_docs.py
      executable_command: uv run python
      description: Export the cloud of covariances and its three means as Plotly JSON for the docs site
group: "Context · Illustrations"
