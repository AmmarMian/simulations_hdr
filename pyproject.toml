[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hdrlib"]

[project]
name = "simulations"
version = "0.1.0"
description = "Simulations and figures for an HDR dissertation on covariance matrices: from multivariate statistics to deep learning."
readme = "README.md"
requires-python = ">=3.12"
# What `import hdrlib` itself needs, plus the runner. Anything a single
# chapter needs and the library does not lives in that chapter's extra below.
dependencies = [
    "matplot2tikz>=0.5.3",
    "matplotlib>=3.10.3",
    "numpy>=2.3.2",
    "qanat",
    "rich>=14.1.0",
    "scipy>=1.16.1",
    "torch>=2.9.0",
]

# Two independent axes of extras: which chapter you want to run, and which
# hardware you want to run it on. They compose --
#   uv sync --extra learning --extra cupy
#
# Chapters. `--extra chapters` takes all four.
#   uv sync --extra context        # 1 -- context
#   uv sync --extra detection      # 2 -- detection
#   uv sync --extra learning       # 3 -- learning
#   uv sync --extra deeplearning   # 4 -- deep learning
#
# Hardware. numpy and torch-cpu need nothing extra.
#   uv sync --extra jax            # JAX CPU-only
#   uv sync --extra jax-cuda       # JAX with CUDA 12 GPU support
#   uv sync --extra jax-metal      # Apple Silicon GPU
#   uv sync --extra cupy           # NVIDIA CUDA (adjust suffix for your driver)
[project.optional-dependencies]
context = [
    "plotly>=6.8.0",
]
detection = [
    "plotly>=6.8.0",
    # action_add_to_docs.py assembles the detection-map contact sheets.
    "pillow>=10.0",
]
learning = [
    "plotly>=6.8.0",
]
deeplearning = [
    "yetanotherspdnet",
]
chapters = [
    "simulations[context,detection,learning,deeplearning]",
]
jax = [
    "jax>=0.4",
    "jaxlib>=0.4",
]
jax-cuda = [
    "jax[cuda12]>=0.4",
]
jax-metal = [
    "jax-metal>=0.1",
]
cupy = [
    # cupy-cuda12x covers CUDA 12.x; change to cupy-cuda11x for CUDA 11.x
    "cupy-cuda12x>=13",
]

# jax[cuda12] pulls jaxlib-cuda12-plugin etc. from the JAX CUDA index.
[[tool.uv.index]]
name = "jax-cuda-releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Line length is defined above for the formatter but not enforced as a lint
# error — research scripts intentionally carry long literal/expression lines.
ignore = ["E501"]

[tool.uv.sources]
qanat = { git = "https://github.com/ammarmian/qanat" }
# Pinned to the packaging fix until it lands on main: the released layout
# installs the top-level package without its subpackages, so the import
# fails outright. See Yet-Another-Research-Organisation/yetanotherspdnet#6.
yetanotherspdnet = { git = "https://github.com/Yet-Another-Research-Organisation/yetanotherspdnet", branch = "fix/packaging-subpackages" }

[dependency-groups]
# Development-time only: lets the ICML 2024 reference implementation be
# imported side by side with hdrlib. Nothing in hdrlib depends on these.
reference = [
    "pymanopt>=2.2.0",
    "scikit-learn>=1.5",
]
# Installed by default by `uv sync`; never shipped to a consumer of hdrlib.
dev = [
    "hatchling>=1.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.4",
    # The docs generator and register_latex.py read the experiment YAMLs.
    "pyyaml>=6.0.3",
    # docs/scripts/example_viz.py builds the plotly figures of the docs.
    "plotly>=6.8.0",
    "pytest>=8.3.4",
    "ruff>=0.15.12",
]
