name: learning_hyperspectral_metrics
description: Euclidean, log-Euclidean and affine-invariant K-means on a hyperspectral scene — what the geometry alone buys, before any correction, entirely on the device
path: 3-learning/hyperspectral-metrics
executable: 3-learning/hyperspectral-metrics/main.py
executable_command: uv run python
tags:
  - learning
  - clustering
  - hyperspectral
  - gpu
params:
  scene: salinas
  n_features: 5
  window_size: 5
  n_init: 10
  backend: torch-cuda
actions:
  - register:
      name: register
      executable: register_latex.py
      executable_command: uv run python
      description: Stage a chosen figure to hdr_exports/ for the LaTeX dissertation
  - add_to_docs:
      name: add_to_docs
      executable: 3-learning/hyperspectral-metrics/action_add_to_docs.py
      executable_command: uv run python
      description: Export the segmentation maps as Plotly JSON for docs
group: "Learning · Random matrix theory"
