  - random-matrix-theory
  - frechet-mean
  - monte-carlo
params:
  n_features: 64
  n_trials: 100
actions:
  - register:
      name: register
      executable: register_latex.py
      executable_command: uv run python
      description: Stage a chosen figure (.tex) to hdr_exports/ for the LaTeX dissertation
  - add_to_docs:
      name: add_to_docs
      executable: 3-learning/frechet_mse/action_add_to_docs.py
