<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · HDR Simulations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("hdr-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="16" cy="16" r="12.5"/>
          <ellipse cx="16" cy="16" rx="5" ry="12.5"/>
          <path d="M3.5 16h25"/>
        </svg>
      </span>
      <span class="brand-name">HDR Simulations</span>
      <span class="brand-badge">HDR</span>
    </a>
  </div>
</header>

<div class="shell">
  <main class="page-content" id="content">
    <div class="page-header">
      <div class="eyebrow">404</div>
      <h1>Page not found</h1>
      <p class="standfirst">This page doesn't exist, or it has moved since the link was made.</p>
    </div>
    <p class="not-found-links">
      <a class="src-btn" href="/">Home</a>
      <a class="src-btn" href="/experiments-overview/">Experiments</a>
      <a class="src-btn" href="/api/">API reference</a>
    </p>
  </main>
</div>

</body>
</html>
