name: sar_mc_roc
description: Courbes ROC des quatre detecteurs de changements, hors ligne et en ligne
path: 2-detection/sar_experiments/mc_simulations
executable: 2-detection/sar_experiments/mc_simulations/mc_roc_detectors.py
executable_command: uv run python
tags:
  - detection
  - kronecker
  - roc
  - H1
  - monte-carlo
params:
  n_trials: 10000
  T_list: "5,12,49"
actions:
  - plot:
      name: plot
      executable: 2-detection/sar_experiments/action_plot.py
      executable_command: uv run python
      description: Run all auto-generated *_plot.py scripts in the run directory
  - register:
      name: register
      executable: register_latex.py
      executable_command: uv run python
      description: Copy a chosen figure + provenance into the HDR LaTeX repo
group: "SAR · Monte Carlo"
